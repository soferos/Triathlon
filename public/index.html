  <template id="method">
    <div class="card">
      <h2>How the plan thinks</h2>
      <p>This is built for a trained athlete. It assumes you can handle real work, and it spends your limited recovery capacity where the evidence says it pays. Nothing here is beginner scaffolding; the only conservative element is the return-to-training block, and that is deliberate: aerobic fitness returns faster than tendon, bone and connective-tissue tolerance, so load comes back in the order <b>frequency → volume → intensity</b>, with running intensity last.</p>
      <ul class="clean">
        <li><b>Periodisation backwards from A-races.</b> Rebuild → base → build → specific → taper → race → transition. B-races get a short freshen-up and replace key sessions; C-races are trained through.</li>
        <li><b>Intensity distribution.</b> Mostly low intensity year-round (≈75–85% of time below the first threshold), pyramidal in base/build, shifting towards race-specific and polarised work close to the race.</li>
        <li><b>Load by fitness, not by template.</b> Weekly load is derived from your chronic training load (CTL) and a ramp of ≈3–5 CTL points/week, capped by your availability. After each Intervals.icu sync the plan re-anchors to what you actually did — missed weeks lower the next target, they are never “made up”.</li>
        <li><b>Recovery weeks</b> every 3rd or 4th week (2:1 for masters or by choice), with threshold tests at the end of selected recovery weeks so targets stay current.</li>
        <li><b>Hard days hard, easy days easy.</b> Key sessions are spaced, strength is consolidated onto hard days, and one day is kept fully free.</li>
        <li><b>Durability.</b> Long sessions carry quality late (tempo and race-pace blocks on tired legs), because races are decided by what your threshold looks like after hours of work.</li>
        <li><b>Power first.</b> Bike and run sessions are prescribed in watts (run power removes the terrain and wind noise that pace has); pace and heart rate are available per sport. Swims are prescribed from critical swim speed.</li>
        <li><b>Daily readiness.</b> 7-day HRV trend against your own normal range, resting HR, sleep, form and how you feel decide whether to execute, shift or replace today’s session.</li>
        <li><b>Heavy strength.</b> Two sessions/week of low-rep, high-load work in base/build, one in season. It improves economy and durability; it does not add meaningful mass at endurance volumes.</li>
        <li><b>Fuel the work.</b> High carbohydrate for key and long sessions (60–90+ g/h), and enough total energy. Chronic low energy availability is the fastest way back to another lay-off.</li>
      </ul>
    </div>
    <div class="card">
      <h2>Coming back from a health break</h2>
      <p>The plan cannot see your medical history. If your break was for anything cardiac, respiratory, bone-stress or hormonal, get explicit clearance for high-intensity work from your physician before the plan’s first VO2max block — then train without second-guessing it. Report symptoms in the daily check-in; the plan will pull intensity until you are 48 h symptom-free.</p>
    </div>
